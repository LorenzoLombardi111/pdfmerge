<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A817"/>
      <stop offset="100%" stop-color="#C48A10"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Left doc (back, offset) -->
  <rect x="3" y="5" width="12" height="16" rx="1.5" fill="#fff" opacity="0.45"/>
  <!-- Right doc (back, offset) -->
  <rect x="17" y="5" width="12" height="16" rx="1.5" fill="#fff" opacity="0.45"/>
  <!-- Center merged doc -->
  <rect x="9" y="3" width="14" height="18" rx="2" fill="#fff"/>
  <!-- Text lines on merged doc -->
  <rect x="12" y="7" width="8" height="1.3" rx="0.6" fill="#D4960F"/>
  <rect x="12" y="10" width="8" height="1.3" rx="0.6" fill="#D4960F"/>
  <rect x="12" y="13" width="5.5" height="1.3" rx="0.6" fill="#D4960F"/>
  <!-- Merge arrows pointing inward -->
  <path d="M6 25l4-3v6z" fill="#fff" opacity="0.9"/>
  <path d="M26 25l-4-3v6z" fill="#fff" opacity="0.9"/>
  <!-- Connecting line -->
